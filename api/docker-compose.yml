services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: synos
      POSTGRES_PASSWORD: synos
      POSTGRES_DB: synos
    ports:
      - "5432:5432"
    volumes:
      - synos_postgres_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  synos_postgres_data:
